# Public CI for this repository: everything that can be checked without
# an Azure subscription. The production path is pipelines/infra.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      OPA_VERSION: 1.4.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8

      - name: Terraform format and validate
        run: |
          terraform fmt -check -recursive infra
          for dir in infra/envs/prod infra/modules/build-agents; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - name: Install OPA
        run: |
          curl -sSL -o /usr/local/bin/opa "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa

      - name: Policy unit tests
        run: opa test policy/ -v

      # blueprint-prod.json is a real plan of infra/envs/prod. The platform
      # must pass its own rules, and the same change from an agent must not.
      - name: Policy gate on real and example plans
        run: |
          expect_allowed() { scripts/policy-check.sh "$1" "$2"; }
          expect_blocked() {
            if scripts/policy-check.sh "$1" "$2"; then
              echo "::error::$1 by $2 should have been blocked"
              exit 1
            fi
          }
          expect_allowed examples/plans/blueprint-prod.json human
          expect_blocked examples/plans/blueprint-prod.json ai-agent
          expect_allowed examples/plans/ai-safe-change.json ai-agent
          expect_blocked examples/plans/ai-risky-change.json ai-agent

      - name: Render the build agent overlays
        run: |
          mkdir -p rendered
          for team in platform/build-agents/teams/*/; do
            kubectl kustomize "$team" > "rendered/$(basename "$team").yaml"
          done

      - name: Checkov security scan
        run: |
          pipx install checkov
          checkov --directory infra --framework terraform --compact --quiet
          checkov --directory rendered --framework kubernetes --compact --quiet
